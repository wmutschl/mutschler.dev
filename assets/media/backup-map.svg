  <rect class="bm-box bm-ghost" x="320" y="542" width="176" height="58"/>
  <path class="bm-disk" d="M320,547 A88,5 0 0 1 496,547 L496,595 A88,5 0 0 1 320,595 Z"/>
  <path class="bm-lid" d="M320,547 A88,5 0 0 0 496,547"/>
  <text class="bm-h" x="332" y="569">Crucial P1 1 TB</text>
  <text x="332" y="587">external SSD</text>

  <path class="bm-line" d="M602,514 L602,540" marker-end="url(#bm-arrow)"/>
  <text class="bm-lbl" x="612" y="532">Time Machine, hourly</text>

  <rect class="bm-box bm-ghost" x="566" y="542" width="176" height="58"/>
  <path class="bm-disk" d="M566,547 A88,5 0 0 1 742,547 L742,595 A88,5 0 0 1 566,595 Z"/>
  <path class="bm-lid" d="M566,547 A88,5 0 0 0 742,547"/>
  <text class="bm-h" x="578" y="569">SanDisk 4 TB</text>
  <text x="578" y="587">external SSD</text>

  <!-- The MacBook Pro's second Time Machine disk is in the office: an off-site copy, so accent -->
