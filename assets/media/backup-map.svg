  <path class="bm-disk" d="M888,453 A88,5 0 0 1 1064,453 L1064,517 A88,5 0 0 1 888,517 Z"/>
  <path class="bm-lid" d="M888,453 A88,5 0 0 0 1064,453"/>
  <text class="bm-h" x="900" y="475">LaCie 2 TB</text>
  <text x="900" y="493">Time Machine of the</text>
  <text x="900" y="509">MacBook Pro, docked</text>

  <!-- Legend, bottom left under the Mac mini -->
  <path class="bm-line" d="M36,492 L76,492"/>
  <text class="bm-note" x="84" y="496">copy at home</text>
  <path class="bm-accent" d="M36,512 L76,512"/>
  <text class="bm-note" x="84" y="516">off-site copy</text>
  <text class="bm-note" x="36" y="542">Times are local (Europe/Berlin).</text>
  <text class="bm-note" x="36" y="560">Time Machine disks are encrypted.</text>
  <text class="bm-note" x="36" y="578">Wyse jobs report to healthchecks.io;</text>
  <text class="bm-note" x="36" y="596">AIO reports in Nextcloud.</text>
</svg>
