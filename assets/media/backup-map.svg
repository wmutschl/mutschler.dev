<svg xmlns="http://www.w3.org/2000/svg" class="bm" viewBox="0 0 1100 740" role="img" aria-labelledby="bm-title bm-desc">
  <title id="bm-title">Map of my backups in November 2026</title>
  <desc id="bm-desc">Four locations drawn as frames. Home, from top to bottom: the Raspberry Pi 4 with Home Assistant OS sends a daily encrypted backup at about 05:00 over SMB to the Dell Wyse 5070. The Mac mini does not sync to Nextcloud; it runs Gitea, which mirrors my repositories on GitHub, GitLab and Dynare's GitLab, and modCraft, and it keeps my Photos library; it backs up hourly with Time Machine to a Samsung T7 2 TB, which therefore also holds the Photos library and the nightly Gitea backups. My wife's MacBook Air backs up hourly with Time Machine to a Crucial P1 1 TB. My MacBook Pro backs up hourly with Time Machine to a SanDisk 4 TB at home and, when docked in the office, to a LaCie 2 TB there. Both MacBooks sync to Nextcloud on the Wyse over Tailscale. All Time Machine disks are encrypted. On the Wyse, the encrypted system SSD holds the Nextcloud data, the host and the Home Assistant backups, with hourly btrbk snapshots (48 hourly, 7 daily). btrbk sends a copy every day at 01:30 to HDD 1, a 6 TB WD Elements with LUKS2 that keeps 30 daily, 12 weekly and 12 monthly copies. Nextcloud All-in-One makes an encrypted Borg backup every early morning to HDD 2, a 4 TB Toshiba. Hetzner data centre: every day at 06:30 rsync over SSH mirrors the Borg repository and the Home Assistant backups to a Storage Box, which takes its own daily snapshots. Planned, drawn dashed: an HP Elite Tower 800 G9 becomes the main server at home; the Wyse with the WD Elements moves to my mom's and pulls btrbk copies from the HP over Tailscale, probably replacing the Storage Box; the Toshiba becomes an offline copy in the office, updated by hand with btrbk; a second Time Machine disk for the Mac mini stays in the office and is swapped with the T7.</desc>
  <style>
    /* Colours come from the page's tokens when the SVG is inlined (Handbook), with fallbacks for anywhere else. */
    .bm { --bm-paper: var(--paper, #F6F7F8); --bm-ink: var(--ink, #1C1F24); --bm-pencil: var(--pencil, #4A515B); --bm-rule: var(--rule, #C9CED4); --bm-spot: var(--spot, #B0122C); }
    @media (prefers-color-scheme: dark) {
      .bm { --bm-paper: var(--paper, #1D2126); --bm-ink: var(--ink, #E3E5E8); --bm-pencil: var(--pencil, #A7AEB7); --bm-rule: var(--rule, #3A4048); --bm-spot: var(--spot, #F27D8F); }
    }
    .bm .bm-paper { fill: var(--bm-paper); }
    .bm .bm-box { fill: var(--bm-paper); stroke: var(--bm-ink); stroke-width: 1.2; }
    .bm .bm-frame { fill: none; stroke: var(--bm-rule); stroke-width: 1.6; }
    .bm .bm-line { fill: none; stroke: var(--bm-pencil); stroke-width: 1.4; }
    .bm .bm-accent { fill: none; stroke: var(--bm-spot); stroke-width: 2; }
    .bm .bm-dash { stroke-dasharray: 6 5; }
    .bm .bm-head-pencil { fill: var(--bm-pencil); }
    .bm .bm-head-accent { fill: var(--bm-spot); }
    .bm text { font-family: var(--text-font, Literata, Georgia, serif); font-size: 13px; fill: var(--bm-ink); }
    .bm .bm-h { font-size: 15px; font-weight: 600; }
    .bm .bm-loc { font-size: 18px; font-style: italic; }
    .bm .bm-lbl { fill: var(--bm-pencil); font-style: italic; }
    .bm .bm-lbl-accent { fill: var(--bm-spot); font-style: italic; }
    .bm .bm-note { fill: var(--bm-pencil); }
  </style>
